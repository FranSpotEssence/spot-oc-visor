<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOT ESSENCE — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(212,175,55,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 70%, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 16px;
      padding: 52px 48px 44px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #d4af37, #f5e176);
      border-radius: 14px;
      margin-bottom: 16px;
      font-size: 22px;
      font-weight: 700;
      color: #0a0a0a;
      letter-spacing: -1px;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #d4af37;
    }

    .brand-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-align: center;
      margin-bottom: 32px;
    }

    .error-msg {
      margin-bottom: 20px;
      padding: 12px 16px;
      background: rgba(220,53,69,0.15);
      border: 1px solid rgba(220,53,69,0.35);
      border-radius: 8px;
      font-size: 12px;
      color: #f8a5ae;
      line-height: 1.5;
    }

    .ms-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #2f2f2f;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .ms-btn:hover {
      background: #3a3a3a;
      border-color: rgba(255,255,255,0.3);
    }

    .ms-btn:active { transform: scale(0.98); }

    .ms-logo {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: rgba(255,255,255,0.2);
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .domain-note {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      line-height: 1.5;
    }
    .domain-note span {
      color: rgba(212,175,55,0.6);
      font-weight: 600;
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-mark">SE</div>
      <div class="brand-name">Spot Essence</div>
      <div class="brand-sub">Supply Chain Intelligence</div>
    </div>

    <h1>Acceso al Visor</h1>
    <p class="subtitle">Inicia sesión con tu cuenta corporativa</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <a href="/auth/start" class="ms-btn">
      <!-- Logo Microsoft SVG inline -->
      <svg class="ms-logo" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
        <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Iniciar sesión con Microsoft
    </a>

    <div class="domain-note">
      Acceso restringido a cuentas <span>@spotessence.cl</span>
    </div>

    <div class="footer-note">Solo para uso interno — Spot Essence</div>
  </div>
</body>
</html>
